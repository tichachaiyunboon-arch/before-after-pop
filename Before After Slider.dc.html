<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;background:#0d0d0f;}a{color:#fff;}a:hover{color:#ddd;}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;box-sizing:border-box;background:#0d0d0f;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <div ref="{{ frameRef }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" style="position:relative;width:100%;max-width:1440px;aspect-ratio:2878 / 1552;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.06);cursor:ew-resize;user-select:none;touch-action:pan-y;background:#000;">
    <img src="assets/after.png" alt="After" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none;"></img>
    <img src="assets/before.png" alt="Before" draggable="false" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;pointer-events:none;clip-path:{{ clip }};"></img>
    <div style="position:absolute;top:20px;left:20px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,0.6);color:#fff;font-size:12px;font-weight:700;letter-spacing:0.16em;pointer-events:none;">BEFORE</div>
    <div style="position:absolute;top:20px;right:20px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,0.6);color:#fff;font-size:12px;font-weight:700;letter-spacing:0.16em;pointer-events:none;">AFTER</div>
    <div style="position:absolute;top:0;bottom:0;left:{{ posPct }};width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,0.4);pointer-events:none;">
      <div style="position:absolute;top:50%;left:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;gap:6px;color:#111;font-size:26px;line-height:1;font-weight:400;">
        <span style="margin-top:-3px;">‹</span><span style="margin-top:-3px;">›</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pos: 50 };
  frameRef = React.createRef();
  dragging = false;
  setFromEvent(e) {
    const r = this.frameRef.current.getBoundingClientRect();
    const p = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100));
    this.setState({ pos: p });
  }
  renderVals() {
    const p = this.state.pos;
    return {
      frameRef: this.frameRef,
      posPct: p + '%',
      clip: `inset(0 ${100 - p}% 0 0)`,
      onDown: (e) => { this.dragging = true; e.currentTarget.setPointerCapture(e.pointerId); this.setFromEvent(e); },
      onMove: (e) => { if (this.dragging) this.setFromEvent(e); },
      onUp: () => { this.dragging = false; },
    };
  }
}
</script>
</body>
</html>
